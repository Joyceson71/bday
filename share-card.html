<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Make My Birthday Card — Happy Birthday Amma 💜</title>
  <meta name="description" content="Generate and download a commemorative Happy Birthday Amma card to share with family."/>
  <link rel="stylesheet" href="css/theme.css"/>
  <link rel="stylesheet" href="css/animations.css"/>
  <style>
    .card-hero {
      padding: 2.2rem 1rem 6rem;
      max-width: 820px;
      margin: 0 auto;
      text-align: center;
    }

    .room-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(179,136,235,0.18);
      border: 1px solid rgba(212,175,55,0.4);
      border-radius: 50px;
      padding: 0.4rem 1.2rem;
      font-size: 0.85rem;
      color: var(--gold-champagne);
      font-family: var(--font-heading);
      margin-bottom: 0.8rem;
    }

    .maker-card {
      background: linear-gradient(145deg, rgba(38,6,68,0.92) 0%, rgba(18,2,36,0.98) 100%);
      border: 2px solid var(--gold-metallic);
      border-radius: 24px;
      padding: clamp(1.5rem, 4vw, 2.5rem);
      box-shadow: 0 16px 50px rgba(0,0,0,0.65), var(--glow-gold);
      margin-bottom: 2rem;
    }

    /* Live Canvas Preview */
    .card-preview-wrap {
      max-width: 480px;
      margin: 1.5rem auto;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 15px 45px rgba(0,0,0,0.7), var(--glow-gold);
      border: 3px solid var(--gold-metallic);
      background: #000;
    }

    #card-canvas {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Photo Selector Carousel */
    .photo-pick-row {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      overflow-x: auto;
      padding: 1rem 0;
      margin-bottom: 1.2rem;
    }

    .photo-pick-thumb {
      width: 68px;
      height: 68px;
      border-radius: 12px;
      object-fit: cover;
      cursor: pointer;
      border: 2px solid rgba(212,175,55,0.4);
      transition: all 0.2s;
    }

    .photo-pick-thumb:hover, .photo-pick-thumb.active {
      border-color: var(--gold-bright);
      transform: scale(1.12);
      box-shadow: var(--glow-gold);
    }

    .custom-greeting-input {
      width: 100%;
      max-width: 480px;
      background: rgba(20,2,40,0.7);
      border: 1px solid rgba(212,175,55,0.45);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      color: #fff;
      font-family: var(--font-body);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      text-align: center;
      outline: none;
    }

    .custom-greeting-input:focus {
      border-color: var(--gold-bright);
    }
  </style>
</head>
<body>

<div class="bokeh bokeh-1"></div>
<div class="bokeh bokeh-2"></div>
<div class="bokeh bokeh-3"></div>
<canvas id="particles-canvas" aria-hidden="true"></canvas>
<div class="fairy-lights" aria-hidden="true"></div>

<!-- Progress Bar -->
<div id="progress-bar" role="navigation" aria-label="Amma's party rooms progress"></div>

<!-- Music Toggle -->
<button id="music-toggle" aria-label="Toggle background music">🎵</button>

<!-- Page Transition Overlay -->
<div id="page-transition" aria-hidden="true" style="opacity:0;pointer-events:none;">
  <div class="curtain-left"></div>
  <div class="curtain-right"></div>
</div>

<main class="page-wrapper" role="main">
  <div class="card-hero">

    <span class="room-badge">Bonus Room ✦ Royal Keepsake Card</span>
    <h1 class="invite-title" style="font-size:clamp(1.8rem, 4.5vw, 2.8rem); margin-bottom:0.4rem;">
      Make Amma's Birthday Card 💌
    </h1>
    <p style="color:var(--purple-lavender); font-style:italic; max-width:620px; margin:0 auto 1.5rem;">
      "Choose your favourite photo, personalize your greeting, and download or share this commemorative keepsake card."
    </p>

    <div class="maker-card">
      <div style="font-family:var(--font-heading); color:var(--gold-champagne); font-size:0.95rem; margin-bottom:0.4rem;">
        ✦ Tap a photo to feature on the card:
      </div>

      <!-- Photo Picker Thumbnails -->
      <div class="photo-pick-row" id="photo-picker"></div>

      <!-- Custom Subtitle Input -->
      <div>
        <input
          type="text"
          class="custom-greeting-input"
          id="custom-subtitle"
          value="Our Queen Forever ✦ October 23, 2026"
          placeholder="Our Queen Forever ✦ October 23, 2026"
          aria-label="Card subtitle"
        />
      </div>

      <!-- Canvas Preview (800x1000) -->
      <div class="card-preview-wrap">
        <canvas id="card-canvas" width="800" height="1000"></canvas>
      </div>

      <!-- Action Buttons -->
      <div style="display:flex; gap:1.2rem; justify-content:center; flex-wrap:wrap; margin-top:1.5rem;">
        <button class="btn btn-gold" id="dl-card-btn" style="padding:0.85rem 2.2rem; font-size:1rem; box-shadow:0 0 25px rgba(255,215,0,0.6);">
          📥 Download Card as PNG
        </button>
        <button class="btn btn-purple" id="share-card-btn" style="padding:0.85rem 2rem; font-size:1rem;">
          📤 Share via WhatsApp / Web Share
        </button>
      </div>
    </div>

    <!-- Quick Navigation -->
    <div style="margin-top:1.5rem; display:flex; gap:1rem; justify-content:center; flex-wrap:wrap;">
      <a href="party-corner.html" class="btn btn-glass" style="text-decoration:none;">
        ← Back to Party Corner
      </a>
      <a href="hug.html" class="btn btn-ghost" style="text-decoration:none;">
        🤗 A Virtual Hug Room
      </a>
    </div>

  </div>
</main>

<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script>
  sharedInit(5);
  Music.setVolume(0.24);

  const canvas = document.getElementById('card-canvas');
  const ctx    = canvas.getContext('2d');
  const picker = document.getElementById('photo-picker');
  const subInput = document.getElementById('custom-subtitle');

  // Candidate photos from config
  const candidatePhotos = [
    (CONFIG.photos?.current?.[0]?.src) || "assets/photos/current/WhatsApp Image 2026-10-22 at 4.42.07 PM.jpeg",
    (CONFIG.photos?.current?.[1]?.src) || "assets/photos/current/WhatsApp Image 2026-10-22 at 4.42.08 PM.jpeg",
    (CONFIG.photos?.marriage?.[0]?.src) || "assets/photos/marriage/WhatsApp Image 2026-10-22 at 4.41.18 PM (1).jpeg",
    (CONFIG.photos?.college?.[0]?.src) || "assets/photos/college/WhatsApp Image 2026-10-22 at 4.40.36 PM.jpeg",
    (CONFIG.photos?.appa?.[0]?.src) || "assets/photos/appa/photo1.jpeg",
  ];

  let selectedPhotoSrc = candidatePhotos[0];

  // Populate thumbnails
  candidatePhotos.forEach((src, idx) => {
    const thumb = document.createElement('img');
    thumb.src = src;
    thumb.className = 'photo-pick-thumb' + (idx === 0 ? ' active' : '');
    thumb.alt = `Option ${idx + 1}`;
    thumb.loading = 'lazy';
    thumb.addEventListener('click', () => {
      document.querySelectorAll('.photo-pick-thumb').forEach(t => t.classList.remove('active'));
      thumb.classList.add('active');
      selectedPhotoSrc = src;
      renderCard();
      playSound('pop');
    });
    picker.appendChild(thumb);
  });

  subInput.addEventListener('input', () => {
    renderCard();
  });

  function renderCard() {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      // 1. Royal Deep Purple Gradient Background
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, '#2A044A');
      grad.addColorStop(0.5, '#1A0230');
      grad.addColorStop(1, '#0C0017');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 2. Ornate Double Gold Borders
      ctx.strokeStyle = '#D4AF37';
      ctx.lineWidth = 6;
      ctx.strokeRect(18, 18, canvas.width - 36, canvas.height - 36);

      ctx.strokeStyle = 'rgba(255, 215, 0, 0.4)';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(28, 28, canvas.width - 56, canvas.height - 56);

      // Corner flourishes
      ctx.font = '28px serif';
      ctx.fillStyle = '#FFD700';
      ctx.fillText('✦', 38, 55);
      ctx.fillText('✦', canvas.width - 55, 55);
      ctx.fillText('✦', 38, canvas.height - 38);
      ctx.fillText('✦', canvas.width - 55, canvas.height - 38);

      // 3. Top Heading
      ctx.textAlign = 'center';
      ctx.font = 'bold 36px serif';
      ctx.fillStyle = '#FFE79A';
      ctx.shadowColor = 'rgba(255,215,0,0.7)';
      ctx.shadowBlur = 15;
      ctx.fillText('Happy Birthday Amma 💜', canvas.width / 2, 95);

      ctx.font = 'italic 28px serif';
      ctx.fillStyle = '#FFFFFF';
      ctx.shadowBlur = 10;
      ctx.fillText(CONFIG.fullName || 'Glory Gnana Selvi', canvas.width / 2, 140);
      ctx.shadowBlur = 0;

      // 4. Center Featured Photo in Arch/Rounded Frame
      const frameX = 70;
      const frameY = 175;
      const frameW = canvas.width - 140;
      const frameH = 590;

      ctx.save();
      // Rounded rectangle clipping path
      ctx.beginPath();
      ctx.roundRect(frameX, frameY, frameW, frameH, 24);
      ctx.clip();

      // Cover scaling
      const imgRatio = img.width / img.height;
      const frameRatio = frameW / frameH;
      let drawW, drawH, drawX, drawY;

      if (imgRatio > frameRatio) {
        drawH = frameH;
        drawW = frameH * imgRatio;
        drawX = frameX - (drawW - frameW) / 2;
        drawY = frameY;
      } else {
        drawW = frameW;
        drawH = frameW / imgRatio;
        drawX = frameX;
        drawY = frameY - (drawH - frameH) / 2;
      }
      ctx.drawImage(img, drawX, drawY, drawW, drawH);
      ctx.restore();

      // Golden frame stroke around photo
      ctx.strokeStyle = '#FFD700';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.roundRect(frameX, frameY, frameW, frameH, 24);
      ctx.stroke();

      // 5. Bottom Subtitle & Quote
      const sub = subInput.value.trim() || "Our Queen Forever ✦ October 23, 2026";
      ctx.font = 'bold 26px sans-serif';
      ctx.fillStyle = '#FFD700';
      ctx.fillText(sub, canvas.width / 2, 825);

      ctx.font = 'italic 22px serif';
      ctx.fillStyle = '#D1C4E9';
      ctx.fillText('"You are our greatest blessing, our strength, and our home."', canvas.width / 2, 875);

      // Footer signature
      ctx.font = 'bold 18px sans-serif';
      ctx.fillStyle = 'rgba(255, 215, 0, 0.75)';
      ctx.fillText('Built with love by JD ✦ for Amma 💜', canvas.width / 2, 945);
    };
    img.src = selectedPhotoSrc;
  }

  // Initial draw
  renderCard();

  // Download Handler
  document.getElementById('dl-card-btn').addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = `happy-birthday-amma-${Date.now()}.png`;
    a.click();
    celebrate();
    playSound('success');
    showToast("Birthday card downloaded successfully! 💌💜");
  });

  // Web Share API Handler
  document.getElementById('share-card-btn').addEventListener('click', async () => {
    canvas.toBlob(async (blob) => {
      const file = new File([blob], 'happy-birthday-amma.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            title: 'Happy Birthday Amma 💜',
            text: 'Happy Birthday Amma 💜 Glory Gnana Selvi — celebrating you today and always!',
            files: [file]
          });
          showToast("Shared with love! 💖");
        } catch {
          // user cancelled or share failed
        }
      } else {
        // Fallback: download and toast
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = `happy-birthday-amma-${Date.now()}.png`;
        a.click();
        showToast("Card downloaded! You can now share it directly to WhatsApp 💜", 4000);
      }
    });
  });
</script>
</body>
</html>
